<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F7F9FC}
a{color:#B8181F}a:hover{color:#0F2340}
*{box-sizing:border-box}
input,select,textarea,button{font-family:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.in1{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both .1s}
.in2{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both .25s}
.in3{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both .4s}
.spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 60s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.ping{position:absolute;inset:0;border-radius:999px;animation:ping 2s ease-out infinite}
.tile{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;color:#FFFFFF;text-align:left;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.tile:hover{transform:translateY(-4px);box-shadow:0 24px 44px -18px rgba(15,35,64,.45)}
.tile .bgz{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile:hover .bgz{transform:scale(1.08)}
.tile .cap{transform:translateY(8px);opacity:.85;transition:all .35s}
.tile:hover .cap{transform:none;opacity:1}
.tile .zoomic{opacity:0;transform:scale(.7);transition:all .35s}
.tile:hover .zoomic{opacity:1;transform:none}
.navlink{position:relative;text-decoration:none;font-weight:700;font-size:15px;padding:8px 0}
.navlink::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:#D8222A;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.navlink:hover{color:#D8222A !important}.navlink:hover::after{transform:scaleX(1)}
.chip{transition:all .25s}.chip:hover{border-color:#D8222A}
.menu-btn{display:none !important}
@media (max-width: 1140px){.nav-links{display:none !important}.menu-btn{display:inline-flex !important}.hide-sm{display:none !important}}
@keyframes progressGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes hdrShadow{to{box-shadow:0 14px 34px -14px rgba(15,35,64,.38)}}
@keyframes logoShrink{to{transform:scale(.8)}}
@keyframes totopIn{from{opacity:0;visibility:hidden;transform:translateY(16px)}to{opacity:1;visibility:visible;transform:none}}
@keyframes ecg{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.ecg{animation:ecg 5s linear infinite}
.hdr-logo{transform-origin:left center}
.totop{transition:background .25s}.totop:hover{background:#D8222A !important}
@supports (animation-timeline: scroll()){
.sprog{animation:progressGrow linear both;animation-timeline:scroll(root)}
.hdr-bar{animation:hdrShadow linear both;animation-timeline:scroll(root);animation-range:0 160px}
.hdr-logo{animation:logoShrink linear both;animation-timeline:scroll(root);animation-range:0 160px}
.totop{animation:totopIn linear both;animation-timeline:scroll(root);animation-range:400px 600px}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>

<div id="top" style="font-family: Manrope, system-ui, sans-serif; color: #0F2340; background: #F7F9FC; min-height: 100vh">
<dc-import name="Header" active="gallery" style="position: sticky; top: -34px; z-index: 60; display: block" hint-size="100%,124px"></dc-import>

<section style="position: relative; background: #0F2340; color: #FFFFFF; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 28px 28px"></div>
<div aria-hidden="true" style="position: absolute; width: 480px; height: 480px; right: -140px; top: -200px; border-radius: 50%; background: radial-gradient(circle, rgba(216,34,42,.5), transparent 65%)"></div>
<svg class="hide-sm" aria-hidden="true" viewBox="0 0 300 300" style="position: absolute; right: 8%; top: 50%; width: 240px; margin-top: -120px; opacity: .5"><g class="spin"><circle cx="150" cy="150" r="140" fill="none" stroke="#FF5A50" stroke-width="2" stroke-dasharray="3 12"></circle></g><g class="spinr"><circle cx="150" cy="150" r="110" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="14" stroke-dasharray="1.5 9"></circle></g></svg>
<div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 64px 24px 72px">
<div class="in1" style="font-size: 14px; color: #9DAEC4; margin-bottom: 14px"><a href="index.html" style="color: #CBD5E1; text-decoration: none">Home</a> <span aria-hidden="true">/</span> <span style="color: #FF7A6E; font-weight: 700">Gallery</span></div>
<h1 class="in2" style="font-family: Sora, sans-serif; font-size: clamp(34px, 4.6vw, 56px); margin: 0 0 12px; letter-spacing: -1px">Photo &amp; video gallery</h1>
<p class="in3" style="font-size: 18px; color: #CBD5E1; margin: 0; max-width: 620px; line-height: 1.6">Moments from the conference — scientific sessions, ceremonies and more. Select any item to view it larger.</p>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 44px 24px 90px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; margin-bottom: 26px">
<div role="tablist" aria-label="Media type" style="display: flex; gap: 6px; background: #FFFFFF; border: 1px solid #E3E8EF; padding: 6px; border-radius: 999px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.icon}} {{t.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap" aria-label="Albums">
<sc-for list="{{albums}}" as="a" hint-placeholder-count="5">
<button class="chip" type="button" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
</div>
<div style="font-size: 14px; color: #52606F; margin-bottom: 18px">{{countLabel}}</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); grid-auto-rows: 210px; grid-auto-flow: dense; gap: 16px">
<sc-for list="{{items}}" as="g" hint-placeholder-count="10">
<button class="tile" type="button" onClick="{{g.open}}" aria-label="Open {{g.t}}" style="{{g.cell}}">
<span class="bgz" style="position: absolute; inset: 0; background: {{g.bg}}"></span>
<span aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 18px 18px"></span>
<span style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(10,26,48,.82))"></span>
<sc-if value="{{g.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: 64px; height: 64px"><span class="ping" style="background: rgba(255,255,255,.5)"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #D8222A"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></span>
<span style="position: absolute; right: 14px; top: 14px; background: rgba(10,26,48,.7); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800">{{g.dur}}</span>
</sc-if>
<sc-if value="{{g.photo}}" hint-placeholder-val="{{ true }}">
<span class="zoomic" style="position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; color: #0F2340; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span>
</sc-if>
<span class="cap" style="position: absolute; left: 18px; right: 18px; bottom: 16px">
<span style="display: block; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #FFB4AC">{{g.album}}</span>
<span style="display: block; font-weight: 800; font-size: 16px; margin-top: 2px">{{g.t}}</span>
</span>
</button>
</sc-for>
</div>
<p style="font-size: 13px; color: #52606F; margin-top: 22px">Photos and videos will be uploaded by BSPMR through the admin panel.</p>
</section>

<sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="Gallery viewer" style="position: fixed; inset: 0; z-index: 100; background: rgba(6,16,32,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .25s both">
<button type="button" aria-label="Close viewer" onClick="{{close}}" style="position: absolute; right: 20px; top: 20px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<div style="width: 100%; max-width: 980px; display: flex; align-items: center; gap: 14px">
<button type="button" aria-label="Previous" onClick="{{prev}}" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #FFFFFF; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="{{viewStyle}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 22px 22px"></div>
<sc-if value="{{sel.video}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 86px; height: 86px"><span class="ping" style="background: rgba(255,255,255,.45)"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #D8222A"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></div>
</sc-if>
<sc-if value="{{sel.photo}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7); flex-direction: column; gap: 8px; font-weight: 700"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 8"></path></svg>Photo placeholder</div>
</sc-if>
</div>
<button type="button" aria-label="Next" onClick="{{next}}" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #FFFFFF; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="color: #FFFFFF; text-align: center; margin-top: 18px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #FF9A90">{{sel.album}}</div>
<div style="font-family: Sora, sans-serif; font-size: 20px; font-weight: 700; margin-top: 4px">{{sel.t}}</div>
<div style="font-size: 14px; color: #9DAEC4; margin-top: 4px">{{position}}</div>
</div>
</div>
</sc-if>

<dc-import name="Footer" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'photo', album: 'All', sel: -1 }; }
  renderVals() {
    const S = this.state;
    const bgs = [
      'linear-gradient(135deg, #D8222A, #0F2340)', 'linear-gradient(135deg, #EA5B2B, #8E1A12)', 'linear-gradient(135deg, #1E3558, #0F2340)',
      'linear-gradient(135deg, #F07A5A, #D8222A)', 'linear-gradient(135deg, #0F2340, #A8161D)', 'linear-gradient(135deg, #2B4A75, #0A1A30)'
    ];
    const photos = [
      ['Day 1', 'Inaugural ceremony', 'big'], ['Day 1', 'Keynote lecture', ''], ['Scientific Sessions', 'Neuro-rehabilitation session', 'tall'],
      ['Day 1', 'Poster presentations', ''], ['Day 1', 'Award ceremony', 'wide'], ['Scientific Sessions', 'Free paper presentation', ''],
      ['Day 2', 'Opening session', ''], ['Day 2', 'Panel discussion', 'tall'], ['Day 2', 'Delegates at the venue', ''],
      ['Scientific Sessions', 'Audience Q&A', 'wide'], ['Day 2', 'Group photo', ''], ['Day 1', 'Exhibition hall', '']
    ];
    const videos = [
      ['Day 1', 'Conference highlights', 'wide', '3:24'], ['Day 1', 'Inaugural speech', '', '12:05'],
      ['Scientific Sessions', 'Session recap', '', '4:48'], ['Day 2', 'Conference highlights', 'wide', '2:56'],
      ['Day 2', 'Keynote lecture recording', '', '38:10'], ['Scientific Sessions', 'Free paper highlights', '', '9:32']
    ];
    const isVid = S.tab === 'video';
    const src = isVid ? videos : photos;
    const spans = { big: 'grid-column: span 2; grid-row: span 2;', tall: 'grid-row: span 2;', wide: 'grid-column: span 2;', '': '' };
    const albumNames = ['All', 'Day 1', 'Day 2', 'Scientific Sessions'];
    const list = src.filter((x) => S.album === 'All' || x[0] === S.album);
    const items = list.map((x, i) => ({
      album: x[0].toUpperCase(), t: x[1], dur: x[3] || '', video: isVid, photo: !isVid,
      bg: bgs[(i + (isVid ? 2 : 0)) % bgs.length],
      cell: 'animation: fadeUp .5s both; animation-delay: ' + (i * 0.04) + 's; ' + spans[x[2]],
      open: () => this.setState({ sel: i })
    }));
    const tabs = [['photo', 'Photos', '▣'], ['video', 'Videos', '▶']].map(([id, label, icon]) => ({
      label, icon, pick: () => this.setState({ tab: id, sel: -1 }),
      style: 'border: 0; cursor: pointer; padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 14px; min-height: 46px; transition: all .3s; ' + (S.tab === id ? 'background: #D8222A; color: #FFFFFF;' : 'background: transparent; color: #0F2340;')
    }));
    const albums = albumNames.map((a) => ({
      label: a, pick: () => this.setState({ album: a, sel: -1 }),
      style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 800; font-size: 13px; cursor: pointer; ' + (S.album === a ? 'background: #0F2340; color: #FFFFFF; border: 1.5px solid #0F2340;' : 'background: #FFFFFF; color: #0F2340; border: 1.5px solid #D3DAE4;')
    }));
    const n = items.length;
    const idx = S.sel >= 0 && S.sel < n ? S.sel : -1;
    const sel = idx >= 0 ? items[idx] : (items[0] || { t: '', album: '', video: false, photo: true, bg: bgs[0] });
    return {
      tabs, albums, items,
      countLabel: n + (isVid ? ' video' : ' photo') + (n === 1 ? '' : 's') + (S.album === 'All' ? '' : ' in ' + S.album),
      hasSel: idx >= 0, sel,
      position: (idx + 1) + ' of ' + n,
      viewStyle: 'position: relative; flex: 1; min-width: 0; aspect-ratio: 16 / 10; max-height: 70vh; border-radius: 20px; overflow: hidden; animation: pop .35s cubic-bezier(.2,.7,.2,1) both; background: ' + sel.bg,
      close: () => this.setState({ sel: -1 }),
      prev: () => this.setState({ sel: (idx - 1 + n) % n }),
      next: () => this.setState({ sel: (idx + 1) % n })
    };
  }
}
</script>
</body>
</html>
