      ['Circular', 'First circular — Call for registration', 'Conference overview, fees and important dates', 'PDF', true],
      ['Abstract', 'Abstract submission guidelines', 'Format, categories, template and deadline', 'PDF', true],
      ['Program', 'Tentative scientific program', 'Session-wise schedule (subject to change)', 'PDF', false],
      ['Sponsorship', 'Sponsorship & exhibition brochure', 'Opportunities for industry partners', 'PDF', false],
      ['Abstract', 'Abstract template', 'Structured abstract format', 'DOCX', false],
      ['Circular', 'Accommodation & travel information', 'Partner hotels and airport transfer', 'PDF', false],
      ['Circular', 'Second circular', '[To be published]', 'PDF', false]
    ];
    const cats = ['All', 'Circular', 'Program', 'Abstract', 'Sponsorship'];
    const filters = cats.map((c) => ({
      label: c, pick: () => this.setState({ filter: c }),
      style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 800; font-size: 13px; cursor: pointer; ' + (S.filter === c ? 'background: #D8222A; color: #FFFFFF; border: 1.5px solid #D8222A;' : 'background: #FFFFFF; color: #0F2340; border: 1.5px solid #D3DAE4;')
    }));
    const q = S.q.trim().toLowerCase();
    const list = all
      .filter((n) => (S.filter === 'All' || n[0] === S.filter) && (!q || (n[1] + ' ' + n[2]).toLowerCase().indexOf(q) >= 0))
      .map((n, i) => ({ cat: n[0].toUpperCase(), t: n[1], s: n[2], file: n[3], isNew: n[4], d: '[DD]', m: '[MON]', delay: (i * 0.05) + 's' }));
    return {
      filters, list, empty: list.length === 0,
      search: (e) => this.setState({ q: (e && e.target && e.target.value) || '' })
    };
  }
}
</script>
